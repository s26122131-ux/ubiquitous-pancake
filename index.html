<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網真程式課 - 作品集入口網站</title>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. 全局變數與基礎設定
       ========================================== */
    :root {
      --bg-dark: #0d0f17;
      --card-bg: rgba(22, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-glow: #6366f1;
      --secondary-glow: #a855f7;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --locked-color: #475569;
      --locked-bg: rgba(15, 23, 42, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
      position: relative;
    }

    /* 酷炫背景光暈 */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }
    body::before {
      background: var(--primary-glow);
      top: -100px;
      left: -100px;
    }
    body::after {
      background: var(--secondary-glow);
      bottom: -100px;
      right: -100px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ==========================================
       2. 個人資訊區 (Header Profile)
       ========================================== */
    .profile-section {
      text-align: center;
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInDown 0.8s ease-out;
    }

    /* 動態光環大頭貼 */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 1.2rem;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow), var(--accent-cyan));
      animation: spinGlow 4s linear infinite;
      filter: blur(4px);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 1;
      border: 3px solid #0f172a;
      background-color: #1e293b;
    }

    .user-name {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-sub) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    .course-title {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    /* 遊戲關卡進度條 */
    .progress-bar-container {
      width: 240px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .progress-fill {
      height: 8px;
      width: 12.5%; /* 2/16 = 12.5% */
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary-glow));
      border-radius: 10px;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-left: 10px;
      font-weight: 600;
    }

    /* ==========================================
       3. 16 個按鈕關卡網格 (Grid Layout)
       ========================================== */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      width: 100%;
      perspective: 1000px;
    }

    /* 響應式：平板 2 欄，手機 1 欄 */
    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 520px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================
       4. 卡片樣式 & 酷炫 Hover 動畫
       ========================================== */
    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      cursor: pointer;
    }

    .card-number {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 0.5rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-status {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
      margin-top: 0.8rem;
    }

    /* --- 已解鎖狀態 (Unlocked Cards) --- */
    .card.unlocked {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .card.unlocked .card-number {
      color: var(--accent-cyan);
    }

    .card.unlocked .card-status {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    /* Hover 動畫：浮起、發光與流光線條 */
    .card.unlocked::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      transform: rotate(30deg);
      transition: 0.6s;
      opacity: 0;
    }

    .card.unlocked:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary-glow);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.5);
    }

    .card.unlocked:hover::after {
      opacity: 1;
      animation: shine 1.2s ease-in-out;
    }

    /* --- 未解鎖狀態 (Locked Cards) --- */
    .card.locked {
      background: var(--locked-bg);
      border-color: rgba(255, 255, 255, 0.03);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .card.locked .card-title {
      color: var(--locked-color);
    }

    .card.locked .card-status {
      background: rgba(255, 255, 255, 0.05);
      color: var(--locked-color);
    }

    .card.locked:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.1);
      opacity: 0.8;
    }

    .card.locked:hover .lock-icon {
      animation: lockShake 0.4s ease-in-out;
    }

    /* ==========================================
       5. 特效 Keyframes 動畫
       ========================================== */
    @keyframes spinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lockShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(12deg); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(6deg); }
    }

    /* 點擊未解鎖時的搖晃提示 */
    .shake {
      animation: cardShake 0.4s ease-in-out !important;
    }

    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    /* 提示 Pop-up Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.8rem 1.5rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 個人資訊區 -->
    <header class="profile-section">
      <div class="avatar-wrapper">
        <!-- 預設假圖片大頭貼 -->
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="大頭貼">
      </div>
      <h1 class="user-name">Alex Chen</h1>
      <p class="course-title">網真程式課作品集</p>
      
      <!-- 關卡進度條 -->
      <div class="progress-bar-container">
        <div class="progress-fill"></div>
        <span class="progress-text">2 / 16 解鎖</span>
      </div>
    </header>

    <!-- 16 個關卡按鈕區 -->
    <main class="grid-container">
      
      <!-- 按鈕 1：已解鎖 -->
      <a href="w1/index.html" class="card unlocked">
        <span class="card-number">WEEK 01</span>
        <div class="card-title">
          Week 1 - 數位名片
        </div>
        <span class="card-status">⚡ 已解鎖</span>
      </a>

      <!-- 按鈕 2：已解鎖 -->
      <a href="w2/index.html" class="card unlocked">
        <span class="card-number">WEEK 02</span>
        <div class="card-title">
          Week 2 - 今天吃甚麼？
        </div>
        <span class="card-status">⚡ 已解鎖</span>
      </a>

      <!-- 按鈕 3 ~ 16：未解鎖 -->
      <!-- 採用 JavaScript 自動生成 Week 3 到 16 的未解鎖按鈕，保持 HTML 乾淨 -->
      <script>
        const grid = document.currentScript.parentElement;
        for (let i = 3; i <= 16; i++) {
          const formattedWeek = i < 10 ? `0${i}` : i;
          const cardHTML = `
            <div class="card locked" onclick="triggerLockedEffect(this)">
              <span class="card-number">WEEK ${formattedWeek}</span>
              <div class="card-title">
                <span class="lock-icon">🔒</span> Week ${i} - 任務鎖定中
              </div>
              <span class="card-status">未解鎖</span>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHTML);
        }
      </script>

    </main>
  </div>

  <!-- 未解鎖提示 Toast -->
  <div id="toast" class="toast">🔒 該關卡尚未解鎖，請先完成前置任務！</div>

  <script>
    // 未解鎖卡片點擊特效
    function triggerLockedEffect(card) {
      // 觸發震動動畫
      card.classList.remove('shake');
      void card.offsetWidth; // 強制重繪
      card.classList.add('shake');

      // 顯示 Toast 提示
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
